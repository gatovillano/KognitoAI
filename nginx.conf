# nginx.conf

# Configuración del servidor principal para servir el frontend.
server {
    # Nginx escuchará en el puerto 80 DENTRO del contenedor.
    listen 80;
    server_name _;

    # La raíz donde se encuentran los archivos de nuestra aplicación web.
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Configuración para manejar las rutas.
    location / {
        # Intenta servir el archivo solicitado directamente, luego como un directorio,
        # y si todo falla, devuelve el index.html (clave para Single Page Apps).
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Configuración para evitar errores de cache durante el desarrollo.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires -1;
        add_header Pragma "no-cache";
        add_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0";
    }
}