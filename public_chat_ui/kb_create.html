<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Base de Conocimientos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="assets/logo.png" alt="Kognito Logo" class="sidebar-logo">
                <h2>Kognito AI</h2>
                <button class="sidebar-close-btn" id="sidebar-close-btn">×</button>
            </div>
            <nav class="sidebar-nav">
                <button class="sidebar-action-btn" id="back-to-docs-btn">
                    ← Volver a Documentos
                </button>
            </nav>
            <footer class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="user-avatar">U</div>
                    <span class="user-name" id="user-name">Usuario</span>
                </div>
            </footer>
        </aside>
        <main class="chat-main">
            <div class="kb-create-center">
                <h2>Nombre de la base de conocimientos</h2>
                <input type="text" id="kb-name-input" placeholder="Ej: Proyectos, Recetas, Notas de clase">
                <button class="button-primary" id="kb-create-confirm-btn">Crear</button>
            </div>
        </main>
    </div>
    <script type="module" src="js/kb_create.js"></script>
</body>
</html>
