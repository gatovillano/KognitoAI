<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Documentos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="assets/logo.png" alt="Kognito Logo" class="sidebar-logo">
                <h2>Kognito AI</h2>
                <button class="sidebar-close-btn" id="sidebar-close-btn">×</button>
            </div>
            <nav class="sidebar-nav">
                <button class="sidebar-action-btn" id="back-to-kb-btn">
                    ← Volver a la base de conocimientos
                </button>
            </nav>
            <footer class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="user-avatar">U</div>
                    <span class="user-name" id="user-name">Usuario</span>
                </div>
            </footer>
        </aside>
        <main class="chat-main">
            <div class="kb-upload-center" id="kb-upload-center">
                <h2 id="kb-title">Base de conocimientos</h2>
                <button class="button-primary kb-upload-btn" id="kb-upload-btn">
                    Subir documentos
                </button>
                <input type="file" id="kb-file-input" multiple accept=".pdf,.docx,.txt" style="display:none;">
                <div class="kb-doc-list" id="kb-doc-list"></div>
            </div>
        </main>
    </div>
    <script type="module" src="js/kb_upload.js"></script>
</body>
</html>
