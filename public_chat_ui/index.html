<!-- public_chat_ui/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kognito AI - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="logo-container">
            <img src="assets/logo.png" alt="Kognito Logo" class="auth-logo">
            <h1>Kognito AI System</h1>
        </div>

        <!-- Vista 1: Solicitar Código -->
        <div id="request-code-view" class="view active">
            <h2>Acceso a la Plataforma</h2>
            <p class="description">
                Introduce tu alias de Telegram para recibir un código de acceso único en tu chat.
            </p>
            <form id="request-code-form">
                <div class="form-group">
                    <input type="text" id="telegram-id-input" placeholder="Tu alias de Telegram (ej: gatovillano)" required>
                </div>
                <button type="submit" class="button-primary">Enviar Código de Acceso</button>
            </form>
        </div>

        <!-- Vista 2: Verificar Código -->
        <div id="verify-code-view" class="view">
            <h2>Verificar Identidad</h2>
            <p class="description">
                Hemos enviado un código a tu chat de Telegram. Introdúcelo a continuación.
            </p>
            <form id="verify-code-form">
                <div class="form-group">
                    <input type="text" id="verification-code-input" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" placeholder="Código de 6 dígitos" required>
                </div>
                <button type="submit" class="button-primary">Verificar e Ingresar</button>
            </form>
            <button id="back-to-request" class="button-secondary">Volver a solicitar</button>
        </div>

        <div id="status-message" class="status-message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
