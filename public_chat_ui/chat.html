<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kognito AI - Chat</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-layout">
        <!-- Sidebar del Chat (Contenedor de Hilos de Chat, Acciones, Perfil) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="assets/logo.png" alt="Kognito Logo" class="sidebar-logo">
                <h2>Kognito AI</h2>
                <button class="sidebar-close-btn" id="sidebar-close-btn">×</button>
            </div>

            <nav class="sidebar-nav">
                <button class="sidebar-action-btn" id="new-chat-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 4V20M4 12H20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Nuevo Chat
                </button>
                <button class="sidebar-action-btn" id="documentos-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 4H20V20H4V4Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M8 4V20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 4V20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Documentos
                </button>
                <button class="sidebar-action-btn" id="theme-toggle-btn" title="Cambiar tema">
                    🌙 Oscuro
                </button>
            </nav>

            <div class="chat-history-container">
                <h3 class="history-title">Chats</h3>
                <ul id="chat-history-list">
                    <!-- Los hilos de chat se cargarán aquí por JavaScript -->
                    <li class="loader">Cargando...</li>
                </ul>
            </div>

            <footer class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="user-avatar">U</div>
                    <span class="user-name" id="user-name">Usuario</span>
                </div>
                <button class="logout-btn" id="logout-btn" title="Cerrar sesión">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9M16 17L21 12M21 12L16 7M21 12H9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </footer>
        </aside>

        <!-- Contenido principal del Chat -->
        <main class="chat-main">
            <!-- Cabecera para móvil -->
            <header class="chat-header">
                <button class="menu-toggle-btn" id="menu-toggle-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 12H21M3 6H21M3 18H21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="header-title">
                    <img src="assets/logo.png" alt="Kognito Logo" class="header-logo">
                    Kognito AI System
                </div>
            </header>

            <!-- Ventana de Mensajes del Chat -->
            <div class="chat-window" id="chat-window">
                <div class="welcome-message">
                    <img src="assets/logo.png" alt="Kognito Logo" class="welcome-logo">
                    <h1>Kognito AI System</h1>
                    <p>¿Cómo puedo ayudarte hoy?</p>
                </div>
                <!-- Los mensajes del chat se inyectarán aquí por JavaScript -->
            </div>

            <!-- Área de Input del Chat -->
            <div class="chat-input-area">
                <div class="chat-input-wrapper rounded-pill">
                    <textarea id="chat-input" placeholder="Escribe tu mensaje..." rows="1"></textarea>
                    <button class="send-btn" id="send-btn" disabled>
                        <img src="assets/arrow-up.svg" alt="Enviar" style="display:block;margin:auto;width:22px;height:22px;" />
                    </button>
                    <button class="mic-btn" id="mic-btn" title="Hablar">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="12" fill="currentColor" opacity="0.08"/>
                            <path d="M12 4C13.1046 4 14 4.89543 14 6V12C14 13.1046 13.1046 14 12 14C10.8954 14 10 13.1046 10 12V6C10 4.89543 10.8954 4 12 4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M19 12V13C19 16.3137 16.3137 19 13 19H11C7.68629 19 5 16.3137 5 13V12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 19V22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                <div id="audio-wave" class="audio-wave hidden"></div>
                <p class="footer-text">
                    Kognito AI puede cometer errores. Considera verificar la información importante.
                </p>
            </div>
        </main>
    </div>

    <!-- Script para renderizar Markdown (si lo usas, como sugieren tus comentarios) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Tu archivo JavaScript principal que orquestará los módulos -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
