<!-- public_chat_ui/chat.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kognito AI - Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-layout">
        <!-- Barra Lateral -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="assets/logo.png" alt="Kognito Logo" class="sidebar-logo">
                <h2>Kognito</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="new-chat-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Nuevo Chat
                </button>
            </nav>
            <div class="sidebar-footer">
                <div id="user-profile" class="user-profile">
                    <span class="user-avatar"></span>
                    <span id="user-name" class="user-name">Cargando...</span>
                </div>
                <button id="logout-btn" class="logout-btn" title="Cerrar Sesión">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </aside>

        <!-- Área Principal de Chat -->
        <main class="chat-main">
            <div id="chat-window" class="chat-window">
                <!-- Los mensajes se insertarán aquí dinámicamente -->
                <div class="welcome-message">
                    <img src="assets/logo.png" alt="Kognito Logo" class="welcome-logo">
                    <h2>Kognito AI System</h2>
                    <p>¿Cómo puedo ayudarte hoy?</p>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <textarea id="chat-input" placeholder="Escribe tu mensaje aquí..." rows="1"></textarea>
                    <button id="send-btn" class="send-btn" title="Enviar Mensaje">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
                <p class="footer-text">Kognito AI puede cometer errores. Considera verificar la información importante.</p>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- Para renderizar Markdown -->
    <script src="script.js"></script>
</body>
</html>
