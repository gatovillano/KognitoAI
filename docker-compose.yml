# docker-compose.yml - VERSIÓN CON REDES EXPLÍCITAS

version: "3.8"

services:
  # 1. Base de Datos
  db:
    image: pgvector/pgvector:pg15
    container_name: kognito_db # Nombre explícito
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kognito_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - kognito_network

  # 2. El Cerebro (Servicio Core API)
  # 🔧 API accesible en: http://localhost:8889
  # 📚 Documentación: http://localhost:8889/docs
  core:
    build:
      context: .
      dockerfile: Dockerfile.core.minimal
    container_name: kognito_core # Nombre explícito
    restart: always
    depends_on:
      - db
      - neo4j # El core ahora depende de la base de datos de grafos
    ports:
      - "${API_PORT:-8889}:8000" # API accesible en localhost:8889
    volumes:
      - .:/app
      - ./credentials/gen-lang-client-0283065579-d517663d377f.json:/app/credentials/gen-lang-client-0283065579-d517663d377f.json:ro
    env_file:
      - ./.env
    networks:
      - kognito_network

  # 3. El Cliente de Telegram
  telegram_client:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    container_name: kognito_telegram_client # Nombre explícito
    restart: always
    ports:
      # Puerto para comunicación interna desde otros servicios.
      - "9090:9090"
    depends_on:
      - core
    volumes:
      - ./telegram_client:/app/telegram_client
      - ./run_telegram_bot.py:/app/run_telegram_bot.py
      - ./core:/app/core
      - ./utils:/app/utils
      - ./tmp:/app/tmp
    env_file:
      - ./.env
    networks:
      - kognito_network
    links:
      - core # ¡NUEVO! Creamos un enlace explícito al servicio core.

  # 4. El Frontend de la Web App Pública
  # 🌐 Acceso: http://localhost:8880 
  frontend:
    # Usamos nuestro nuevo Dockerfile
    build:
      context: . # Asume que el Dockerfile y el código de Next.js están en la raíz
      dockerfile: Dockerfile.frontend
      args:
        # Pasamos la URL del backend al proceso de build.
        # Para producción usa la URL pública, para desarrollo usa localhost:8889
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://apibase.gatoslibres.art}"
    container_name: kognito_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://apibase.gatoslibres.art}"
    # 📍 IMPORTANTE: Frontend accesible en http://localhost:8880
    # (El puerto 3000 que aparece en logs es interno del contenedor)
    ports:
      - "${FRONTEND_PORT:-8880}:3000"
    depends_on:
      - core
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./next.config.mjs:/app/next.config.mjs
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./postcss.config.js:/app/postcss.config.js
      - ./tsconfig.json:/app/tsconfig.json
    networks:
      - kognito_network
    # El 'links' es opcional en redes modernas, pero no hace daño
    links:
      - core


  telegram_panel:
      build:
        context: .
        dockerfile: Dockerfile.webapp
      restart: always
      # <<--- AÑADIR DIRECTORIO DE TRABAJO ---<<
      working_dir: /app
      ports:
        - "8010:8000"
      volumes:
        # Usar rutas absolutas dentro del contenedor basadas en el working_dir
        - ./telegram_panel:/app/telegram_panel
        - ./run_telegram_panel.py:/app/run_telegram_panel.py
        - ./utils:/app/utils
        - ./telegram_client:/app/telegram_client
      environment:
        DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-telegram_bot_db}
      env_file:
        - ./.env
        
  # 6. Base de Datos de Grafos (Neo4j)
  # 🌐 Acceso al Browser: http://localhost:7474
  # 🔌 Conexión Bolt: bolt://localhost:7687
  neo4j:
    image: neo4j:5.15-community
    container_name: kognito_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      # MODIFICACIÓN: Eliminamos el montaje de la configuración específica que está causando problemas
      # - neo4j_conf:/conf
      # - ./config/neo4j/neo4j.conf:/var/lib/neo4j/conf/neo4j.conf
    environment:
      NEO4J_AUTH: none
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      # Configuración para evitar reinicios
      NEO4J_dbms_default__database: "neo4j"
      NEO4J_dbms_allow__upgrade: "true"
      # Configuración de memoria optimizada
      NEO4J_server_memory_heap_initial__size: "2G"
      NEO4J_server_memory_heap_max__size: "4G"
      NEO4J_server_memory_pagecache_size: "512m"
      # Configuraciones de red estables
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_server_http_listen__address: "0.0.0.0:7474"
      # Configuración de logs usando formato correcto (cambiado del inválido NEO4J_server_logs_user_level)
      NEO4J_dbms_logs_debug_level: "DEBUG"
      # Corregido: Cambiamos 'true' por un valor válido de la enumeración [OFF, INFO, VERBOSE]
      NEO4J_dbms_logs_query_enabled: "INFO"
      # Evitar problemas de concurrencia
      NEO4J_dbms_security_auth__enabled: "false"
      NEO4J_dbms_connector_bolt_enabled: "true"
      NEO4J_dbms_connector_http_enabled: "true"
      # Deshabilitamos la validación estricta para evitar problemas de configuración
      NEO4J_server_config_strict__validation_enabled: "false"
      NEO4J_dbms_memory_transaction_total_max: "6G"   
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - kognito_network

networks:
  kognito_network:
    driver: bridge

volumes:
  db_data:
  pgadmin_data:
  neo4j_data:
  neo4j_logs:
  neo4j_conf:
