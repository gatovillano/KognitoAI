# docker-compose.yml - VERSIÓN CON REDES EXPLÍCITAS

version: "3.8"

services:
  # 1. Base de Datos
  db:
    image: pgvector/pgvector:pg15
    container_name: kognito_db # Nombre explícito
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kognito_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - kognito_network

  # 2. El Cerebro (Servicio Core API)
  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: kognito_core # Nombre explícito
    restart: always
    depends_on:
      - db
    ports:
      - "${API_PORT:-8889}:8000" # Usamos una variable de entorno para el puerto
    volumes:
      - ./core:/app/core
      - .:/app
      - ./tools:/app/tools
      - ./utils:/app/utils
      - ./run_api.py:/app/run_api.py
      - ./telegram_panel:/app/telegram_panel # Añadir este volumen
      - ./credentials/gen-lang-client-0283065579-d517663d377f.json:/app/credentials/gen-lang-client-0283065579-d517663d377f.json:ro
    env_file:
      - ./.env
    networks:
      - kognito_network

  # 3. El Cliente de Telegram
  telegram_client:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    container_name: kognito_telegram_client # Nombre explícito
    restart: always
    ports:
      # Puerto para comunicación interna desde otros servicios.
      - "9090:9090"
    depends_on:
      - core
    volumes:
      - ./telegram_client:/app/telegram_client
      - ./run_telegram_bot.py:/app/run_telegram_bot.py
      - ./core:/app/core
      - ./utils:/app/utils
      - ./tmp:/app/tmp
    env_file:
      - ./.env
    networks:
      - kognito_network
    links:
      - core # ¡NUEVO! Creamos un enlace explícito al servicio core.

  # 4. El Frontend de la Web App Pública <-- ¡AQUÍ ESTÁ EL CAMBIO!
  frontend:
    # Usamos nuestro nuevo Dockerfile
    build:
      context: . # Asume que el Dockerfile y el código de Next.js están en la raíz
      dockerfile: Dockerfile.frontend
      args:
        # Pasamos la URL del backend al proceso de build.
        # Dentro de Docker, el frontend se comunica con el backend usando su nombre de servicio 'core'.
        NEXT_PUBLIC_API_URL: "" 
    container_name: kognito_frontend
    restart: always
    # Mapeamos el puerto 8880 de tu máquina al puerto 3000 del contenedor (donde corre Next.js)
    ports:
      - "${FRONTEND_PORT:-8880}:3000"
    depends_on:
      - core
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./next.config.mjs:/app/next.config.mjs
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./postcss.config.js:/app/postcss.config.js
      - ./tsconfig.json:/app/tsconfig.json
    networks:
      - kognito_network
    # El 'links' es opcional en redes modernas, pero no hace daño
    links:
      - core

  # 5. PGAdmin para administración visual de la base de datos
  pgadmin:
    image: dpage/pgadmin4
    container_name: kognito_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@kognito.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5056:80"
    depends_on:
      - db
    networks:
      - kognito_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin


  telegram_panel:
      build:
        context: .
        dockerfile: Dockerfile.webapp
      restart: always
      # <<--- AÑADIR DIRECTORIO DE TRABAJO ---<<
      working_dir: /app
      ports:
        - "8010:8000"
      volumes:
        # Usar rutas absolutas dentro del contenedor basadas en el working_dir
        - ./telegram_panel:/app/telegram_panel
        - ./run_telegram_panel.py:/app/run_telegram_panel.py
        - ./utils:/app/utils
        - ./telegram_client:/app/telegram_client
      environment:
        DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-telegram_bot_db}
      env_file:
        - ./.env
        
networks:
  kognito_network:
    driver: bridge

volumes:
  db_data:

  pgadmin_data:
