# docker-compose.yml - VERSIÓN CORREGIDA

version: "3.8"

services:
  # 1. Base de Datos
  db:
    image: pgvector/pgvector:pg15
    container_name: kognito_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kognito_db}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - kognito_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kognito_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. El Cerebro (Servicio Core API) - COMENTADO
  # 🔧 API accesible en: http://localhost:8889
  # 📚 Documentación: http://localhost:8889/docs
  # NOTA: Iniciarse localmente con start_local.sh
  # core:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.core.hybrid
  #   container_name: kognito_core
  #   restart: always
  #   command: uvicorn run_api:app --host 0.0.0.0 --port 8000
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - kognito_network

  # 3. Base de Datos de Grafos (Neo4j)
  # 🌐 Acceso al Browser: http://localhost:7474
  # 🔌 Conexión Bolt: bolt://localhost:7687
  neo4j:
    image: neo4j:5.15-community
    container_name: kognito_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./docker/neo4j/docker-entrypoint.sh:/app/docker/neo4j/docker-entrypoint.sh
    environment:
      NEO4J_AUTH: none
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_dbms_default__database: "neo4j"
      NEO4J_dbms_allow__upgrade: "true"
      NEO4J_server_memory_heap_initial__size: "2G"
      NEO4J_server_memory_heap_max__size: "4G"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_server_http_listen__address: "0.0.0.0:7474"
      NEO4J_dbms_logs_debug_level: "ERROR"
      NEO4J_dbms_logs_query_enabled: "OFF"
      NEO4J_dbms_security_auth__enabled: "false"
      NEO4J_dbms_connector_bolt_enabled: "true"
      NEO4J_dbms_connector_http_enabled: "true"
      NEO4J_server_config_strict__validation_enabled: "false"
      NEO4J_dbms_memory_transaction_total_max: "6G"
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell 'RETURN 1' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - kognito_network

  # 4. El Frontend de la Web App Pública - COMENTADO
  # 🌐 Acceso: http://localhost:8880
  # NOTA: Iniciarse localmente con start_local.sh
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.frontend
  #     args:
  #       NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://apibase.gatoslibres.art}"
  #   container_name: kognito_frontend
  #   restart: always
  #   environment:
  #     NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://apibase.gatoslibres.art}"
  #   ports:
  #     - "${FRONTEND_PORT:-8880}:3000"
  #   depends_on:
  #     - core
  #   volumes:
  #     - ./src:/app/src
  #     - ./public:/app/public
  #     - ./package.json:/app/package.json
  #     - ./next.config.mjs:/app/next.config.mjs
  #     - ./tailwind.config.ts:/app/tailwind.config.ts
  #     - ./postcss.config.js:/app/postcss.config.js
  #     - ./tsconfig.json:/app/tsconfig.json
  #   networks:
  #     - kognito_network

  # 5. Servicio de Caching (Redis)
  redis:
    image: redis:7.0-alpine
    container_name: kognito_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - kognito_network

  # 6. Inicialización de Neo4j (crear índices)
  init_neo4j:
    image: neo4j:5.15-community
    container_name: kognito_neo4j_init
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - kognito_network
    volumes:
      - ./docker/neo4j/init_neo4j_indexes.cypher:/init_neo4j_indexes.cypher:ro
    environment:
      NEO4J_AUTH: none
    command: >
      bash -c "
        sleep 10 &&
        cypher-shell -u neo4j -p '' -f /init_neo4j_indexes.cypher || true
      "

  # 7. Servicio TTS Kokoro (Local ONNX)
  # 🌐 Acceso Host: http://localhost:8011
  # 🔌 Acceso Interno: http://kokoro-tts:8011
  kokoro-tts:
    build:
      context: ./kokoro_service
      dockerfile: Dockerfile
    container_name: kokoro-tts
    restart: always
    ports:
      - "8011:8011"
    networks:
      - kognito_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # === MONITOREO Y BACKUP ===
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - kognito_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    networks:
      - kognito_network

  backup:
    image: postgres:15-alpine
    container_name: backup
    restart: always
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      - ./scripts/backup.sh:/backup.sh
      - backups:/backups
    command: ["sh", "-c", "while true; do /backup.sh; sleep 3600; done"]
    networks:
      - kognito_network

networks:
  kognito_network:
    driver: bridge

volumes:
  db_data:
  neo4j_data:
  neo4j_logs:
  credentials:
  prometheus_data:
  grafana_data:
  backups: