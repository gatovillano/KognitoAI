global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'kognito_core'
    static_configs:
      - targets: ['host.docker.internal:8889']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j:2004']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']
