global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'kognito_core'
    static_configs:
      - targets: ['core:8000']
  - job_name: 'postgres'
    static_configs:
      - targets: ['db:5432']
  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j:7474']
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
