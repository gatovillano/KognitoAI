<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KognitoAI - Conexión</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin-bottom: 1.5rem;
      border-radius: 12px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; color: #38bdf8; }
    p { font-size: 0.95rem; color: #94a3b8; line-height: 1.5; margin-bottom: 1.5rem; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
      width: 100%;
    }
    .btn:hover { background: #0369a1; }
    .status {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon.png" alt="KognitoAI" class="icon">
    <h1>Conectando con KognitoAI</h1>
    <p>No se pudo establecer conexión con el servidor. Verifica tu conexión a internet o el estado del servidor.</p>
    <button class="btn" onclick="window.location.reload()">Reintentar conexión</button>
    <div class="status">Intentando reconectar automáticamente...</div>
  </div>
  <script>
    setTimeout(() => {
      window.location.reload();
    }, 5000);
  </script>
</body>
</html>
